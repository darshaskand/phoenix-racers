<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thank you for contacting Phoenix Racers." />
  <title>Message Sent | Phoenix Racers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .thanks-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 5vw;
    }
    .thanks-card {
      width: min(100%, 620px);
      padding: clamp(2rem, 6vw, 4rem);
      text-align: center;
      background: var(--dark-2);
      border: 1px solid rgba(255,255,255,0.08);
      border-top: 4px solid var(--orange);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .thanks-icon {
      display: grid;
      place-items: center;
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      color: #fff;
      background: linear-gradient(135deg, var(--orange), var(--red));
      border-radius: 50%;
      font-size: 2rem;
    }
    .thanks-card h1 {
      margin-bottom: 1rem;
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
    }
    .thanks-card p {
      margin-bottom: 2rem;
      color: var(--silver);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="speed-streaks" aria-hidden="true"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <main class="thanks-page">
    <section class="thanks-card" aria-labelledby="thanks-title">
      <div class="thanks-icon" aria-hidden="true">✓</div>
      <h1 id="thanks-title">Message Sent!</h1>
      <p>Thanks for reaching out. The Phoenix Racers team will get back to you soon.</p>
      <a class="btn btn-primary" href="index.html">Back to Phoenix Racers</a>
    </section>
  </main>
  <script>
    const particlesContainer = document.getElementById("particles");
    for (let i = 0; i < 18; i++) {
      const particle = document.createElement("span");
      particle.className = "particle";
      particle.style.top = `${Math.random() * 100}%`;
      particle.style.width = `${40 + Math.random() * 120}px`;
      particle.style.animationDuration = `${3 + Math.random() * 5}s`;
      particle.style.animationDelay = `${Math.random() * 5}s`;
      particle.style.opacity = `${0.2 + Math.random() * 0.4}`;
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
